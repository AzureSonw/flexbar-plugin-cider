name: Build plugin releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            id: windows-x64
            asset: com.sonw.cider.flexplugin
          - runner: macos-15
            id: macos-arm64
            asset: com.sonw.cider.macos-arm64.flexplugin
          - runner: macos-15-intel
            id: macos-x64
            asset: com.sonw.cider.macos-x64.flexplugin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Load the packaged native Canvas library
        run: node -e "require('./com.sonw.cider.plugin/backend/skia.node')"
      - run: npm run plugin:validate
      - run: npm run plugin:pack
      - name: Name the platform package
        env:
          RELEASE_ASSET: ${{ matrix.asset }}
        run: node -e "const fs = require('node:fs'); fs.mkdirSync('release', { recursive:true }); fs.copyFileSync('com.sonw.cider.flexplugin', 'release/' + process.env.RELEASE_ASSET)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: release/*.flexplugin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.flexplugin
          fail_on_unmatched_files: true
